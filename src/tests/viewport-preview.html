<!doctype html><html lang="en"><meta charset="utf-8"><title>Configurator viewport checks</title><style>body{font:14px system-ui;margin:20px;background:#d9dfd5}button{padding:10px;margin-right:10px}#stage{transform-origin:top left;margin-top:20px}iframe{border:0;display:block}</style><h1>Configurator viewport checks</h1><nav><button data-w="390" data-h="844">Phone 390 × 844</button><button data-w="1920" data-h="1080">Desktop 1920 × 1080</button><button data-w="3840" data-h="2160">4K 3840 × 2160</button></nav><p id="size"></p><div id="stage"><iframe title="Configurator viewport" src="http://127.0.0.1:4174/designs/bilresa/"></iframe></div><script>const frame=document.querySelector('iframe'),stage=document.querySelector('#stage');function resize(w,h){frame.style.width=w+'px';frame.style.height=h+'px';stage.style.width=w+'px';stage.style.height=h+'px';stage.style.transform=`scale(${Math.min(1,(innerWidth-60)/w,(innerHeight-160)/h)})`;document.querySelector('#size').textContent=`Embedded viewport: ${w} × ${h}`;frame.src='http://127.0.0.1:4174/designs/bilresa/';}document.querySelectorAll('button').forEach(b=>b.onclick=()=>resize(Number(b.dataset.w),Number(b.dataset.h)));resize(390,844);</script></html>
