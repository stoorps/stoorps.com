[workspace]
members = ["models/*", "src/engine", "src/tests/fixtures/*"]
default-members = ["models/bilresa", "src/engine"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
cadrum = { version = "=0.8.20", default-features = false }
wasm-bindgen = "=0.2.128"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
model-engine = { path = "src/engine" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Boolean-heavy mesh generation benefits from speed optimisation rather than
# the workspace's size-oriented default. CAD crates retain their own settings.
[profile.release.package.manifold-rust]
opt-level = 3

[profile.release.package.model-lampshade]
opt-level = 3
