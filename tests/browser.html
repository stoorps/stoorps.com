<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>WASM geometry checks</title>
  <h1>Browser WASM geometry checks</h1>
  <pre id="result">Running…</pre>
  <script type="module">
    import { verifyCase, assert } from "./geometry.mjs";
    const worker = new Worker(new URL("../web/worker.js", import.meta.url), {
      type: "module",
    });
    let sequence = 0;
    const pending = new Map();
    const request = (type, extra = {}) =>
      new Promise((resolve, reject) => {
        const id = ++sequence;
        pending.set(id, { resolve, reject });
        worker.postMessage({ id, type, ...extra });
      });
    worker.onmessage = ({ data }) => {
      const p = pending.get(data.id);
      pending.delete(data.id);
      data.error ? p.reject(new Error(data.error)) : p.resolve(data);
    };
    worker.onerror = (e) => {
      document.querySelector("#result").textContent = "FAIL " + e.message;
    };
    try {
      const reports = [];
      for (const params of [
        [40, 30, 12, 10],
        [52, 30, 12, 10],
        [40, 30, 12, 18],
        [60, 45, 20, 8],
        [12, 12, 2, 11],
      ]) {
        const result = await verifyCase(request, params);
        delete result.step;
        delete result.stlBytes;
        reports.push(result);
      }
      for (const params of [
        [40, 30, 12, 30],
        [NaN, 30, 12, 10],
        [40, 30, -1, 10],
      ]) {
        let rejected = false;
        try {
          await request("build", { params });
        } catch {
          rejected = true;
        }
        assert(rejected, "Invalid parameters rejected");
      }
      document.querySelector("#result").textContent = JSON.stringify(
        {
          status: "PASS",
          browser: navigator.userAgent,
          cases: reports,
          invalidInputsRejected: 3,
        },
        null,
        2,
      );
    } catch (error) {
      document.querySelector("#result").textContent = "FAIL " + error.stack;
    } finally {
      worker.terminate();
    }
  </script>
</html>
