group_name: Pattern
parameters:
  - share_id: 6
    key: pattern
    label: Surface
    default: 1
    min: 0
    max: 2
    step: 1
    unit: ""
    help: ""
    options:
      - Rippled shell
      - Cell lattice
      - Strands
    advanced: false

  - share_id: 7
    key: lobes
    label: Ripple count
    default: 24
    min: 0
    max: 48
    step: 1
    unit: ""
    help: ""
    advanced: false

  - share_id: 8
    key: ripple_depth
    label: Ripple depth
    default: 2
    min: 0
    max: 145
    step: 0.1
    unit: mm
    help: Maximum follows the smallest radius, wall thickness and mounting clearance.
    advanced: false

  - share_id: 9
    key: twist
    label: Twist
    default: 25
    min: -90
    max: 90
    step: 1
    unit: °
    help: ""
    advanced: false

  - share_id: 10
    key: density
    label: Pattern density
    default: 80
    min: 0
    max: 100
    step: 1
    unit: ""
    help: Higher density makes smaller cells. Spacing adapts to the shade size; narrow profiles, thick
      strands and twist limit how closely cells can be packed. Applies to the lattice only.
    advanced: false

  - share_id: 11
    key: thickness
    label: Wall / strand thickness
    default: 2
    min: 1.2
    max: 4
    step: 0.1
    unit: mm
    help: Strand mode uses this as the circular rope diameter. Cell lattice uses width and radial depth;
      shell thickness is radial.
    advanced: false
