<!doctype html><html lang="en"><meta charset="utf-8"><title>BILRESA browser checks</title><h1>BILRESA browser checks</h1><pre id="result">Running…</pre><script type="module">
import {assert} from './geometry.mjs';
const worker=new Worker(new URL('../web/worker.js',import.meta.url),{type:'module'});
let sequence=0; const pending=new Map();
const request=(type,extra={})=>new Promise((resolve,reject)=>{const id=++sequence;pending.set(id,{resolve,reject});worker.postMessage({id,type,...extra});});
worker.onmessage=({data})=>{const p=pending.get(data.id);pending.delete(data.id);data.error?p.reject(new Error(data.error)):p.resolve(data);};
worker.onerror=e=>{document.querySelector('#result').textContent='FAIL '+e.message;};
try {const cases=[];
for(const params of [[1,1],[2,0],[0,2],[0,0],[3,1]]){
const built=await request('build-bilresa',{params});assert(built.parts.length===3,'Three preview parts');
const {bytes}=await request('export-bilresa',{part:-1,format:'step'});const imported=await request('inspect',{bytes});assert(imported.result.solids.length===3,'Three STEP solids');
for(let part=0;part<3;part++){const {bytes}=await request('export-bilresa',{part,format:'stl'});assert(bytes.length>84,'STL exported');}
cases.push({counts:params,milliseconds:built.milliseconds});}
for(const params of [[-1,0],[1.5,1],[9,0]]){let rejected=false;try{await request('build-bilresa',{params});}catch{rejected=true;}assert(rejected,'Invalid counts rejected');}
document.querySelector('#result').textContent=JSON.stringify({status:'PASS',cases,invalidCountsRejected:3},null,2);
}catch(error){document.querySelector('#result').textContent='FAIL '+error.stack;}finally{worker.terminate();}
</script></html>
