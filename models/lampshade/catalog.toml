id = "lampshade"
default_view = "solid"
revision = 2
runtime = "mesh"
formats = ["stl"]
title = "Curve lampshade"
description = "Sculpt a rippled shell or an open diamond lattice."
configuration_hint = "Shape the curve, choose a pattern, then adjust the fixture and print setup."
overview = "An original parametric shade with reinforced rims and a removable coarse-thread adapter. Mount depth sets the overhang above the fixture."
print_notes = "Print the adapter and fit-test collar first. STL dimensions are millimetres; place each part flat on the bed in your slicer. Fit-test mode replaces the shade with a short matching collar. Clearances are provisional. Use an LED bulb and verify clearance, temperature and sustained load before installation. Material selection is guidance, not a heat or load rating. Inspect supports and overhangs in your slicer."

