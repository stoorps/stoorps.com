name: Build and publish static site
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore geometry build cache
        uses: actions/cache@v4
        with:
          path: target
          key: wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'src/tools/build-wasm.mjs') }}
      - run: npm ci
      - run: npm run wasm:build
      - run: npm run test:all
      - name: Build for Pages
        env:
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH || '/' }}
        run: npm run build
      - run: npm run typecheck
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
